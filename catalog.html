<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Catalogue du mobilier — Appart 3D</title>
    <style>
      /* follows the system setting: light, or dark like the walkthrough's HUD */
      :root {
        color-scheme: light dark;
        --bg: #faf8f5;
        --panel: #ffffff;
        --line: #e3dfd8;
        --text: #1f1d1a;
        --muted: #6f6a62;
        --accent: #a06a00;
        --hover: #f2eee8;
        --chip: #eeeae3;
        --chip-shine: #e2ddd4;
        --note-bg: #fbf3e0;
        --note-text: #4a4232;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16171a;
          --panel: #1f2125;
          --line: #30333a;
          --text: #ece9e4;
          --muted: #9b9890;
          --accent: #e2b04a;
          --hover: #1c1e22;
          --chip: #2a2c31;
          --chip-shine: #34373d;
          --note-bg: #24231f;
          --note-text: #d9d3c7;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.45 system-ui,
          -apple-system,
          sans-serif;
      }
      a {
        color: inherit;
      }
      header {
        padding: 24px 24px 8px;
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 4px 16px;
      }
      h1 {
        margin: 0;
        font-size: 22px;
        letter-spacing: 0.02em;
      }
      header p {
        margin: 0;
        color: var(--muted);
      }
      .back {
        margin-left: auto;
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
      }
      #catalog {
        padding: 8px 24px 48px;
        display: grid;
        grid-template-columns: 240px minmax(0, 1fr);
        grid-template-areas:
          "facets controls"
          "facets results";
        grid-template-rows: auto 1fr;
        column-gap: 28px;
        align-items: start;
      }
      .c-controls {
        grid-area: controls;
        padding-top: 4px;
      }
      .c-results {
        grid-area: results;
        min-width: 0;
      }
      /* facets: the left panel, it stays in view while the list scrolls */
      .c-facets {
        grid-area: facets;
        position: sticky;
        top: 12px;
        max-height: calc(100dvh - 24px);
        overflow-y: auto;
        padding: 4px 4px 16px 0;
      }
      .c-facets-head {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin: 6px 0 8px;
      }
      .c-facets-head h2 {
        margin: 0;
        font-size: 15px;
      }
      .c-clear {
        all: unset;
        margin-left: auto;
        cursor: pointer;
        color: var(--accent);
        font-size: 13px;
      }
      .c-clear:hover {
        text-decoration: underline;
      }
      .c-empty td {
        padding: 32px 8px;
        color: var(--muted);
        text-align: center;
      }
      .c-empty .c-clear {
        margin-left: 4px;
      }
      .c-clear[hidden] {
        display: none;
      }
      .c-facet {
        border: 0;
        border-top: 1px solid var(--line);
        margin: 0;
        padding: 10px 0 10px;
      }
      .c-facet legend {
        float: left;
        width: 100%;
        margin-bottom: 6px;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
      }
      .c-option {
        clear: both;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 1px 0;
        font-size: 13px;
        cursor: pointer;
      }
      .c-option input {
        margin: 0;
        accent-color: var(--accent);
      }
      .c-option-label {
        flex: 1;
      }
      .c-option-count {
        color: var(--muted);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      .c-option.empty {
        opacity: 0.45;
      }
      .c-range {
        clear: both;
        position: relative;
        height: 28px;
        margin: 0 8px;
      }
      .c-range::before,
      .c-range-fill {
        content: "";
        position: absolute;
        top: 12px;
        height: 4px;
        border-radius: 2px;
      }
      .c-range::before {
        left: 0;
        right: 0;
        background: var(--line);
      }
      .c-range-fill {
        background: var(--accent);
      }
      /* two range inputs on one track: only their thumbs take the pointer */
      .c-range-thumb {
        position: absolute;
        inset: 0;
        width: 100%;
        margin: 0;
        background: none;
        pointer-events: none;
        appearance: none;
        -webkit-appearance: none;
      }
      .c-range-thumb.top {
        z-index: 1;
      }
      .c-range-thumb::-webkit-slider-runnable-track {
        background: none;
        height: 28px;
      }
      .c-range-thumb::-webkit-slider-thumb {
        -webkit-appearance: none;
        pointer-events: auto;
        width: 18px;
        height: 18px;
        margin-top: 5px;
        border-radius: 50%;
        background: var(--panel);
        border: 2px solid var(--accent);
        cursor: grab;
      }
      .c-range-thumb::-moz-range-thumb {
        pointer-events: auto;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--panel);
        border: 2px solid var(--accent);
        cursor: grab;
      }
      .c-range-thumb::-moz-range-track {
        background: none;
      }
      .c-range-thumb:focus-visible::-webkit-slider-thumb {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .c-euro-row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 8px;
      }
      .c-euros {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 4px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 4px 8px;
        color: var(--muted);
      }
      .c-euro-input {
        width: 100%;
        min-width: 0;
        border: 0;
        background: none;
        color: var(--text);
        font: inherit;
        font-variant-numeric: tabular-nums;
      }
      .c-euro-input:focus {
        outline: none;
      }
      .c-euros:focus-within {
        border-color: var(--accent);
      }
      .c-euro-dash {
        color: var(--muted);
      }
      .c-price-note {
        margin: 8px 0 0;
        font-size: 12px;
        color: var(--muted);
      }
      .c-facet-toggle {
        display: none;
        font: inherit;
        color: var(--text);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 7px 11px;
        cursor: pointer;
      }
      .c-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }
      .c-search,
      .c-select,
      .c-dir,
      .c-view {
        font: inherit;
        color: var(--text);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 7px 11px;
      }
      .c-search {
        flex: 1 1 260px;
        max-width: 420px;
      }
      .c-sort {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
      }
      .c-dir,
      .c-view {
        cursor: pointer;
      }
      .c-count {
        color: var(--muted);
        margin: 6px 0 10px;
      }
      .c-table {
        width: 100%;
        border-collapse: collapse;
      }
      .c-table th {
        position: sticky;
        top: 0;
        background: var(--bg);
        z-index: 1;
        text-align: left;
        font-weight: 600;
        color: var(--muted);
        border-bottom: 1px solid var(--line);
        padding: 6px 8px;
        white-space: nowrap;
      }
      .c-th {
        all: unset;
        cursor: pointer;
      }
      .c-th:hover,
      th.sorted .c-th {
        color: var(--accent);
      }
      .c-th[data-dir]:not([data-dir=""])::after {
        content: " " attr(data-dir);
      }
      .c-table td {
        padding: 8px;
        border-bottom: 1px solid var(--line);
        vertical-align: middle;
      }
      .n {
        text-align: right;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      th.n {
        text-align: right;
      }
      .c-row {
        cursor: pointer;
      }
      .c-row:hover,
      .c-row.open {
        background: var(--hover);
      }
      .c-row:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }
      .c-thumb-button {
        all: unset;
        cursor: zoom-in;
        display: block;
      }
      .c-thumb {
        display: block;
        width: 96px;
        height: 96px;
        border-radius: 8px;
        background: #f4f1ec;
        object-fit: cover;
      }
      .c-thumb:not([src]) {
        background: linear-gradient(110deg, var(--chip) 30%, var(--chip-shine) 50%, var(--chip) 70%)
          0 0 / 300% 100%;
        animation: shimmer 1.4s linear infinite;
      }
      @keyframes shimmer {
        to {
          background-position: -300% 0;
        }
      }
      .c-name {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 160px;
      }
      .c-product {
        font-weight: 600;
        text-decoration: none;
      }
      .c-product::after {
        content: " ↗";
        color: var(--accent);
      }
      .c-product:hover {
        text-decoration: underline;
      }
      .c-seller,
      .c-places {
        color: var(--muted);
        font-size: 12px;
      }
      .c-kind {
        display: block;
      }
      .c-kind::first-letter {
        text-transform: uppercase;
      }
      .c-price {
        font-weight: 600;
      }
      .c-unknown {
        color: var(--muted);
        font-style: italic;
      }
      .c-facts {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        max-width: 280px;
      }
      .c-fact {
        font-size: 12px;
        padding: 2px 8px;
        border-radius: 999px;
        background: var(--chip);
        white-space: nowrap;
      }
      .c-more td {
        background: var(--hover);
        padding: 4px 8px 16px 112px;
      }
      .c-details {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 8px 32px;
      }
      .c-details h3 {
        margin: 10px 0 6px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--accent);
      }
      .c-specs {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 3px 12px;
        margin: 0;
      }
      .c-specs dt {
        color: var(--muted);
      }
      .c-specs dd {
        margin: 0;
      }
      .c-sources {
        margin: 8px 0 0;
        padding-left: 18px;
      }
      .c-view {
        margin-top: 10px;
        border-color: var(--accent);
        color: var(--accent);
      }
      .c-note {
        grid-column: 1 / -1;
        margin: 4px 0 0;
        padding: 8px 12px;
        border-left: 3px solid var(--accent);
        background: var(--note-bg);
        color: var(--note-text);
      }
      .c-dialog {
        width: min(920px, 94vw);
        height: min(720px, 88dvh);
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--panel);
        color: var(--text);
        display: none;
        flex-direction: column;
      }
      .c-dialog[open] {
        display: flex;
      }
      .c-dialog::backdrop {
        background: rgb(0 0 0 / 0.6);
      }
      .c-dialog-head {
        display: flex;
        align-items: center;
        padding: 10px 14px;
      }
      .c-dialog h2 {
        margin: 0;
        font-size: 17px;
      }
      .c-close {
        margin-left: auto;
        font: inherit;
        font-size: 18px;
        background: none;
        border: 0;
        color: var(--text);
        cursor: pointer;
      }
      .c-stage {
        flex: 1;
        min-height: 0;
        touch-action: none;
      }
      .c-stage canvas {
        display: block;
      }
      .c-dialog-info {
        margin: 0;
        padding: 10px 14px;
        color: var(--muted);
      }
      /* phones: one card per product, the facets folded behind a button */
      @media (max-width: 860px) {
        header,
        #catalog {
          padding-left: 16px;
          padding-right: 16px;
        }
        #catalog {
          display: block;
        }
        .c-facet-toggle {
          display: block;
        }
        .c-facets {
          display: none;
          position: static;
          max-height: none;
          overflow: visible;
          margin-bottom: 8px;
        }
        .c-facets.open {
          display: block;
        }
        .c-table thead {
          display: none;
        }
        .c-table,
        .c-table tbody {
          display: block;
        }
        .c-row {
          display: grid;
          grid-template-columns: 96px 1fr 1fr 1fr;
          gap: 4px 10px;
          padding: 12px 0;
          border-bottom: 1px solid var(--line);
        }
        .c-table .c-row td {
          border: 0;
          padding: 0;
        }
        .c-row .c-thumb-cell {
          grid-row: span 3;
        }
        .c-row td:nth-child(2) {
          grid-column: 2 / -1;
        }
        .c-row td:nth-child(3) {
          grid-column: 2 / -1;
        }
        .c-row td[data-label] {
          text-align: left;
          font-size: 13px;
        }
        .c-row td[data-label]::before {
          content: attr(data-label);
          display: block;
          font-size: 11px;
          color: var(--muted);
        }
        .c-row .c-facts-cell {
          grid-column: 1 / -1;
        }
        .c-more {
          display: block;
        }
        .c-more[hidden] {
          display: none;
        }
        .c-more td {
          display: block;
          padding: 4px 0 16px;
        }
        .c-specs {
          grid-template-columns: 1fr;
        }
        .c-specs dt {
          margin-top: 4px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Catalogue du mobilier</h1>
      <p>
        Les produits de la visite 3D : modèle, taille et prix du vendeur, origine et
        caractéristiques relevées sur les pages produit. Cliquez une ligne pour le détail.
      </p>
      <a class="back" href="./">← Visite 3D</a>
    </header>
    <main id="catalog"></main>
    <script type="module" src="/src/catalog/main.ts"></script>
  </body>
</html>
