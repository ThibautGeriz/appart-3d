name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Float output differs in the last bits between Node majors (V8 math),
          # so export with the same major as the committed models.
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Re-export the GLB models
        run: npm run export:glb
      - name: Check the committed models are up to date
        run: |
          if ! git diff --quiet -- models/; then
            echo "::error::models/*.glb are stale: run 'npm run export:glb' and commit the result"
            git status --short models/
            exit 1
          fi
      - name: Upload the re-exported models
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: models
          path: models/
      - name: Validate the models (Khronos glTF validator)
        run: npm run validate:glb

  # Frame rate in a real Chromium (desktop and phone), reported on the PR
  perf:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Measure the frame rate
        id: perf
        continue-on-error: true
        run: npm run test:perf
      - run: npm run perf:report
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: Comment on the pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # one comment per PR, updated on every push
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.body | startswith("<!-- perf-report -->"))][0].id // empty')
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@perf-report.md
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file perf-report.md
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-results
          path: perf-results/
      - name: Fail when the test failed
        if: steps.perf.outcome == 'failure'
        run: exit 1

  # Build and publish are separate jobs (GitHub's recommended setup): in one
  # job, deploy-pages sometimes lists the artifact before the upload is visible
  pages-build:
    needs: [check, models]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: pages-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
